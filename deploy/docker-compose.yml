# 仓库根目录即构建上下文（WSS-server 独立仓库）
services:
  node1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "private-chain/src/node.js", "--port", "3001", "--id", "node1"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DEMO_FAST_EXIT: ${DEMO_FAST_EXIT:-0}
      REQUIRE_SIGNATURE: ${REQUIRE_SIGNATURE:-0}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS:-}
      CHECKPOINT_PUBLISHER: ${CHECKPOINT_PUBLISHER:-1}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
      POOL_EXIT_ADDRESS: ${POOL_EXIT_ADDRESS:-TRjvctzrc5WcEeu2UrT8mV5H6zW8dCgimR}
      POOL_ADDRESS_3000: ${POOL_ADDRESS_3000:-}
      POOL_ADDRESS_30000: ${POOL_ADDRESS_30000:-}
      POOL_ADDRESS_300000: ${POOL_ADDRESS_300000:-}
      RAFT_PEERS: '[{"id":"node1","host":"node1","port":3001},{"id":"node2","host":"node2","port":3002},{"id":"node3","host":"node3","port":3003}]'
    volumes:
      - node1-data:/app/private-chain/data
    restart: unless-stopped
    networks: [mmm]

  node2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "private-chain/src/node.js", "--port", "3002", "--id", "node2"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      RAFT_PEERS: '[{"id":"node1","host":"node1","port":3001},{"id":"node2","host":"node2","port":3002},{"id":"node3","host":"node3","port":3003}]'
    volumes:
      - node2-data:/app/private-chain/data
    restart: unless-stopped
    networks: [mmm]

  node3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "private-chain/src/node.js", "--port", "3003", "--id", "node3"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      RAFT_PEERS: '[{"id":"node1","host":"node1","port":3001},{"id":"node2","host":"node2","port":3002},{"id":"node3","host":"node3","port":3003}]'
    volumes:
      - node3-data:/app/private-chain/data
    restart: unless-stopped
    networks: [mmm]

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "gateway/src/index.js"]
    environment:
      GATEWAY_PORT: 8443
      GATEWAY_DOMAINS: ${GATEWAY_DOMAINS:-book26.top,news16.top}
      UPSTREAM_NODES: http://node1:3001,http://node2:3002,http://node3:3003
      WS_UPSTREAM_NODE: http://node1:3001
    ports:
      - "127.0.0.1:8443:8443"
    depends_on: [node1, node2, node3]
    restart: unless-stopped
    networks: [mmm]

  listener:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "listener/src/index.js"]
    environment:
      RAFT_LEADER_API: http://node1:3001
      DEMO_AUTO_CONFIRM: ${DEMO_AUTO_CONFIRM:-0}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
    depends_on: [node1]
    restart: unless-stopped
    profiles: [listener]
    networks: [mmm]

volumes:
  node1-data:
  node2-data:
  node3-data:

networks:
  mmm:
    driver: bridge
